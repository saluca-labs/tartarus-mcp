name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Package metadata, licence and README pins
        run: npm run check:meta
      - name: Dependency audit
        run: npm audit --audit-level=low
      - run: npm run build
      - name: Smoke check the built entry point
        run: node --check dist/index.js
      - name: Runtime smoke test (MCP server, tools/list, store/list/recall/search/forget via SQLite)
        run: npm run smoke
      - name: Tarball contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e 'const f=require("./pack.json")[0].files.map(x=>x.path); for (const need of ["LICENSE","README.md","package.json","dist/index.js"]) { if (!f.includes(need)) { console.error("missing from tarball: "+need); process.exit(1) } } console.log(f.join("\n"))'
